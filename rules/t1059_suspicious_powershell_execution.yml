title: Suspicious PowerShell Execution with Obfuscation or Download Indicators
id: 9c4e2a7b-5f1d-4c8e-a3b6-7d9f1e2c4a8b
status: experimental
description: Detects PowerShell processes launched with encoded, hidden-window, or download-cradle command-line arguments commonly used to evade detection or fetch second-stage payloads
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Ysa
date: 2026-08-24
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_suspicious:
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'
            - '-w hidden'
            - '-windowstyle hidden'
            - 'IEX'
            - 'DownloadString'
            - 'Invoke-Expression'
            - 'Net.WebClient'
    condition: selection_process and selection_suspicious
falsepositives:
    - Legitimate admin scripts and scheduled tasks sometimes use -nop or hidden windows for automation
    - Some deployment/config-management tools (e.g. SCCM, Ansible WinRM) invoke PowerShell with similar flags
level: high 