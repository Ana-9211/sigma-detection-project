title: Process Spawned by WMI Provider Host (Possible Remote WMI Execution)
id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b6c
status: experimental
description: Detects a process created with WmiPrvSE.exe as its parent, consistent with remote or local WMI-based command execution (e.g. wmiexec, PowerShell WMI cmdlets, Impacket wmiexec.py)
references:
    - https://attack.mitre.org/techniques/T1047/
author: Anagha N
date: 2026-08-24
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\WmiPrvSE.exe'
    filter_common:
        Image|endswith:
            - '\wmiprvse.exe'
            - '\conhost.exe'
    condition: selection and not filter_common
falsepositives:
    - Legitimate systems management tools (SCCM, monitoring agents) routinely use WMI and will trigger this
level: medium
