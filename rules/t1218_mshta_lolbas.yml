title: Suspicious Mshta Execution with Script or Remote Content
id: 9c0d1e2f-3a4b-4c5d-6e7f-8a9b0c1d2e3f
status: experimental
description: Detects mshta.exe invoked with inline script or remote content indicators, commonly used to execute malicious HTA payloads while evading application whitelisting
references:
    - https://attack.mitre.org/techniques/T1218/005/
author: Anagha N
date: 2026-08-24
tags:
    - attack.defense-evasion
    - attack.execution
    - attack.t1218.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\mshta.exe'
    selection_cli:
        CommandLine|contains:
            - 'javascript'
            - 'vbscript'
            - 'http'
            - '.hta'
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate HTA-based internal tools or installers may trigger this; verify the HTA source and content
level: medium
