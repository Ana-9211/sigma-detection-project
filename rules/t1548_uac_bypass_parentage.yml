title: Suspicious Child Process from Known UAC Auto-Elevate Binary
id: 7a8b9c0d-1e2f-4a3b-4c5d-6e7f8a9b0c1d
status: experimental
description: Detects cmd.exe or powershell.exe spawned as a child of Windows binaries known to auto-elevate without a UAC prompt, a common UAC bypass pattern
references:
    - https://attack.mitre.org/techniques/T1548/002/
author: Ysa
date: 2026-08-24
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1548.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
    selection_parent:
        ParentImage|endswith:
            - '\fodhelper.exe'
            - '\eventvwr.exe'
            - '\sdclt.exe'
            - '\cmstp.exe'
            - '\CompMgmtLauncher.exe'
            - '\slui.exe'
            - '\WSReset.exe'
    condition: selection_child and selection_parent
falsepositives:
    - Extremely rare in legitimate use; these binaries do not normally spawn a shell as a child
level: high
