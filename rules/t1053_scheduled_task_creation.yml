title: Scheduled Task Creation via schtasks.exe
id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: Detects creation of a scheduled task via schtasks.exe, a common persistence mechanism
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Anagha N
date: 2026-08-24
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_cli:
        CommandLine|contains: '/create'
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate IT administration and software installers frequently create scheduled tasks
level: medium
