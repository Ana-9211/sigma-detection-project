title: Port Forwarding Configuration via netsh interface portproxy
id: 3a4b5c6d-7e8f-4a9b-0c1d-2e3f4a5b6c7d
status: experimental
description: Detects use of netsh.exe to configure port forwarding rules, commonly used to create an internal proxy/relay for command-and-control or lateral pivoting
references:
    - https://attack.mitre.org/techniques/T1090/001/
author: Anagha N
date: 2026-08-24
tags:
    - attack.command-and-control
    - attack.t1090.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\netsh.exe'
    selection_cli:
        CommandLine|contains:
            - 'interface portproxy add'
            - 'portproxy add v4tov4'
            - 'portproxy add v4tov6'
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate network engineers occasionally configure port forwarding for non-malicious relay/NAT purposes
level: medium
