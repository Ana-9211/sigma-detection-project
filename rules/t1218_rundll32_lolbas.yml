title: Suspicious Rundll32 Execution via Known LOLBAS Patterns
id: 8b9c0d1e-2f3a-4b4c-5d6e-7f8a9b0c1d2e
status: experimental
description: Detects rundll32.exe invoked with command-line patterns associated with known living-off-the-land abuse (zipfldr, shdocvw, advpack, comsvcs minidump, etc.)
references:
    - https://attack.mitre.org/techniques/T1218/011/
author: Anagha N
date: 2026-08-24
tags:
    - attack.defense-evasion
    - attack.execution
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_cli:
        CommandLine|contains:
            - 'zipfldr'
            - 'shdocvw'
            - 'advpack'
            - 'pcwutl'
            - 'ExtExport'
            - 'comsvcs'
            - 'MiniDump'
    condition: selection_img and selection_cli
falsepositives:
    - Some legitimate control panel or shell extension invocations may use overlapping DLL names; verify full command line
level: high
