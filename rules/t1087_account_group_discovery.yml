title: Account and Group Discovery via Native Windows Binaries
id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f8a
status: experimental
description: Detects use of net.exe, nltest.exe, or whoami.exe with arguments commonly used for account, group, or domain trust reconnaissance
references:
    - https://attack.mitre.org/techniques/T1087/
    - https://attack.mitre.org/techniques/T1069/
author: Anagha N
date: 2026-08-24
tags:
    - attack.discovery
    - attack.t1087
    - attack.t1069
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
            - '\nltest.exe'
            - '\whoami.exe'
    selection_cli:
        CommandLine|contains:
            - 'net group'
            - 'net localgroup'
            - 'net user'
            - 'nltest /domain_trusts'
            - 'nltest /dclist'
            - 'whoami /priv'
            - 'whoami /groups'
    condition: selection_img and selection_cli
falsepositives:
    - IT admins and legitimate scripts routinely enumerate groups/users for management tasks
level: low
