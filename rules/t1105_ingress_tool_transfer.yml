title: File Download via Certutil or Bitsadmin
id: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a5b
status: experimental
description: Detects use of certutil.exe or bitsadmin.exe to download files, a common living-off-the-land technique for retrieving second-stage payloads
references:
    - https://attack.mitre.org/techniques/T1105/
author: Anagha N
date: 2026-08-24
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\certutil.exe'
            - '\bitsadmin.exe'
    selection_cli:
        CommandLine|contains:
            - 'urlcache'
            - '-split'
            - '/transfer'
            - 'http'
    condition: selection_img and selection_cli
falsepositives:
    - certutil is occasionally used legitimately for certificate operations unrelated to downloads; verify full command line
level: medium
