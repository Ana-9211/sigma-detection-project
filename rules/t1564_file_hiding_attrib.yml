title: File Hiding via attrib.exe
id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
status: experimental
description: Detects use of attrib.exe to hide files, commonly used to conceal malicious artifacts on disk
references:
    - https://attack.mitre.org/techniques/T1564/001/
author: Anagha N
date: 2026-08-24
tags:
    - attack.defense-evasion
    - attack.t1564.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\attrib.exe'
    selection_cli:
        CommandLine|contains:
            - '+h'
            - '+s +h'
    condition: selection_img and selection_cli
falsepositives:
    - Rare in legitimate admin use; some install scripts hide support files
level: medium
